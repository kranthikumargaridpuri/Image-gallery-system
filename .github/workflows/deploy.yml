name: Deploy Image Gallery to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build backend
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Prepare backend jar
        run: |
          mkdir -p deploy
          cp backend/target/*.jar deploy/image-gallery.jar

      - name: Set up Node 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build -- --configuration production

      - name: Prepare frontend files
        run: |
          mkdir -p deploy/frontend
          cp -r frontend/dist/*/* deploy/frontend/

      - name: Copy backend jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "deploy/image-gallery.jar"
          target: "/home/ubuntu/image-gallery/app/"
          strip_components: 1

      - name: Copy frontend files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "deploy/frontend/**"
          target: "/tmp/image-gallery-frontend"
          strip_components: 2

      - name: Restart backend and publish frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            sudo systemctl restart image-gallery-backend

            sudo rm -rf /var/www/image-gallery/*
            sudo cp -r /tmp/image-gallery-frontend/* /var/www/image-gallery/
            sudo chown -R www-data:www-data /var/www/image-gallery

            sudo nginx -t
            sudo systemctl reload nginx

            sudo systemctl status image-gallery-backend --no-pager
