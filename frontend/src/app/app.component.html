<div class="site-wrapper">
  <header class="premium-header">
    <a class="brand" routerLink="/" aria-label="Global Traders home">
      <img src="assets/images/logo.png" class="top-logo" alt="Global Traders logo" />
      <span class="brand-text">
        <strong>GLOBAL</strong>
        <strong>TRADERS</strong>
      </span>
    </a>

    <div class="clock-strip" aria-label="International date and time">
      <div class="clock-item">
        <strong class="clock-country">INDIA</strong>
        <span class="clock-date">{{ india.date }}</span>
        <span class="clock-time">{{ india.time }}</span>
      </div>
      <div class="clock-item">
        <strong class="clock-country">USA</strong>
        <span class="clock-date">{{ usa.date }}</span>
        <span class="clock-time">{{ usa.time }}</span>
      </div>
      <div class="clock-item">
        <strong class="clock-country">UK</strong>
        <span class="clock-date">{{ uk.date }}</span>
        <span class="clock-time">{{ uk.time }}</span>
      </div>
      <div class="clock-item">
        <strong class="clock-country">AUSTRALIA</strong>
        <span class="clock-date">{{ australia.date }}</span>
        <span class="clock-time">{{ australia.time }}</span>
      </div>
      <div class="clock-item">
        <strong class="clock-country">KSA</strong>
        <span class="clock-date">{{ ksa.date }}</span>
        <span class="clock-time">{{ ksa.time }}</span>
      </div>
    </div>

    <div class="account-cluster" aria-label="Account navigation">
      <a class="admin-link" routerLink="/admin">ADMIN</a>
      <div class="account-row" *ngIf="!auth.loggedIn()">
        <a routerLink="/register">REGISTER</a>
        <a routerLink="/login">LOGIN</a>
      </div>
      <div class="account-row" *ngIf="auth.loggedIn()">
        <a routerLink="/cart">CART</a>
        <a href="#" (click)="auth.logout(); $event.preventDefault()">LOGOUT</a>
      </div>
    </div>
  </header>

  <main class="main-body">
    <router-outlet></router-outlet>
  </main>
</div>
