<div class="password-page">
  <div class="password-card">
    <h3>Reset Password</h3>

    <ng-container *ngIf="!resetSuccessful">
      <p class="helper-text">Create a new password for your account. The reset link is valid for 15 minutes and can be used only once.</p>

      <label for="newPassword">New password</label>
      <input
        id="newPassword"
        class="form-control"
        type="password"
        name="newPassword"
        autocomplete="new-password"
        placeholder="Minimum 8 characters"
        [(ngModel)]="newPassword"
        [disabled]="loading || !token"
      />

      <label for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        class="form-control"
        type="password"
        name="confirmPassword"
        autocomplete="new-password"
        placeholder="Re-enter new password"
        [(ngModel)]="confirmPassword"
        [disabled]="loading || !token"
        (keyup.enter)="submit()"
      />

      <button class="btn btn-success w-100" type="button" (click)="submit()" [disabled]="loading || !token">
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </ng-container>

    <div class="alert alert-success" *ngIf="message">{{ message }}</div>
    <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button *ngIf="resetSuccessful" class="btn btn-primary w-100 login-button" type="button" (click)="goToLogin()">
      Go to Login
    </button>

    <a *ngIf="!resetSuccessful" routerLink="/forgot-password" class="back-link">Request a new reset link</a>
  </div>
</div>
