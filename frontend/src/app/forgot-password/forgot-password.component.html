<div class="password-page">
  <div class="password-card">
    <h3>Forgot Password</h3>
    <p class="helper-text">Enter your registered email address. We will send a password-reset link valid for 15 minutes.</p>

    <label for="forgotEmail">Email address</label>
    <input
      id="forgotEmail"
      class="form-control"
      type="email"
      name="email"
      autocomplete="email"
      placeholder="Enter your registered email"
      [(ngModel)]="email"
      [disabled]="loading"
      (keyup.enter)="submit()"
    />

    <button class="btn btn-primary w-100" type="button" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Sending...' : 'Send Reset Link' }}
    </button>

    <div class="alert alert-success" *ngIf="message">{{ message }}</div>
    <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

    <a routerLink="/login" class="back-link">Back to Login</a>
  </div>
</div>
