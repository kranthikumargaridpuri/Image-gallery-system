<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <div class="login-title-row">
        <h3>Login</h3>
        <a class="back-home-link" routerLink="/" aria-label="Back to Home">
          <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5v-9Z"></path>
          </svg>
          <span>Back to Home</span>
        </a>
      </div>

      <div class="alert alert-warning py-2" *ngIf="infoMessage">
        {{ infoMessage }}
      </div>

      <input
        class="form-control my-2"
        type="email"
        placeholder="Email"
        autocomplete="email"
        [(ngModel)]="email"
      />

      <div class="password-field my-2">
        <input
          class="form-control"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Password"
          autocomplete="current-password"
          [(ngModel)]="password"
          (keyup.enter)="login()"
        />

        <button
          type="button"
          class="password-toggle"
          (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          [attr.title]="showPassword ? 'Hide password' : 'Show password'"
        >
          {{ showPassword ? '🙈' : '👁' }}
        </button>
      </div>

      <button class="btn btn-primary btn-block" type="button" (click)="login()">
        Login
      </button>

      <p class="text-danger mt-2">{{ err }}</p>
      <a routerLink="/forgot-password">Forgot Password?</a>
    </div>
  </div>
</div>
