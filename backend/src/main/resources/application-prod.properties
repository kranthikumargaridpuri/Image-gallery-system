server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/image_gallery?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:image_user}
spring.datasource.password=${DB_PASSWORD:Image@12345}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

file.upload-dir=${UPLOAD_DIR:/home/ubuntu/image-gallery/uploads}
spring.web.resources.static-locations=file:${UPLOAD_DIR:/home/ubuntu/image-gallery/uploads}/

app.jwt.secret=${JWT_SECRET:AsprineMindsImageGallerySecretKey2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
# Password reset email - configure these environment variables on the server
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.frontend.reset-password-url=${RESET_PASSWORD_URL:https://gallery.asprineminds.com/reset-password}
